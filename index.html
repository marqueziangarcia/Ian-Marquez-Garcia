<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ian Marquez Garcia</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
        }

        /* Center the two photos at the top */
        .photos {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 26px;
            width: 100%;
            margin: 0 auto;
        }

        .photos img {
            display: block;
            width: 21%;
            max-width: 370px;
            height: auto;
        }

        /* Position the "more" link in the upper-left corner */
        .contact {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            line-height: 1.35;
            color: black;
        }

        /* Keep the "more" link black and underlined */
        .contact a,
        .contact a:visited,
        .contact a:hover,
        .contact a:active {
            color: black;
            text-decoration: underline;
        }

        /* Adjust the layout for mobile screens */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .photos {
                gap: 12px;
                margin-top: 100px;
            }

            .photos img {
                width: calc(50% - 6px);
                max-width: none;
            }

            .contact {
                top: 15px;
                left: 10px;
                font-size: 12pt;
            }
        }
    </style>
</head>

<body>

    <div class="contact">
        <a href="ian_marquez_garcia_111026.pdf">more</a>
    </div>

    <div class="photos">
        <img src="photo1.jpg" alt="">
        <img src="photo2.jpg" alt="">
    </div>

</body>
</html>
